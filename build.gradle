
plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.rabbitmq:amqp-client:5.9.0'
    implementation 'org.jfree:jfreechart:1.5.5'

    // Evita avisos de logging de RabbitMQ sen configurar un logger.
    runtimeOnly 'org.slf4j:slf4j-nop:1.7.30'

    testImplementation 'junit:junit:4.13.2'
}

application {
    mainClass = 'PRabbitMQ.client.ClientMain'
}

// Permite executar o servidor mediante unha tarefa separada.
tasks.register('runServer', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'PRabbitMQ.server.ServerMain'
}
